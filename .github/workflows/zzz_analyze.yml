name: zzz phan tich lenh

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Cap giao dich"
        default: "BTCUSDT"
      interval:
        description: "Khung"
        default: "4h"
      rr:
        description: "R:R"
        default: "1.5"
      split:
        description: "Moc tach huan luyen / kiem tra (YYYY-MM-DD)"
        default: "2023-01-01"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai goi
        run: |
          (cd zzz_backtest && npm install)
          pip install pandas scipy statsmodels scikit-learn tabulate
      - name: Xuat dac diem tung lenh
        working-directory: zzz_backtest
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          INTERVAL: ${{ github.event.inputs.interval }}
          RR: ${{ github.event.inputs.rr }}
        run: |
          npx tsx features.ts
          mkdir -p ../results/zzz
          cp results/zzz/trades_features*.csv ../results/zzz/
      - name: Phan tich
        env:
          SPLIT: ${{ github.event.inputs.split }}
          TAG: ${{ github.event.inputs.symbol == 'BTCUSDT' && '' || format('_{0}', github.event.inputs.symbol) }}
        run: python3 zzz_backtest/analyze.py
      - name: Luu ket qua
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results/zzz/analysis*.md results/zzz/trades_features*.csv
          git commit -m "zzz phan tich lenh: cap nhat" || echo "khong co thay doi"
          git pull --rebase origin main || true
          git push
