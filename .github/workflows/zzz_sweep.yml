name: zzz quet tham so

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Cap giao dich"
        default: "BTCUSDT"
      interval:
        description: "Khung"
        default: "4h"
      split:
        description: "Ngay tach huan luyen / kiem tra"
        default: "2023-01-01"

permissions:
  contents: write

concurrency:
  group: zzz-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai goi
        working-directory: zzz_backtest
        run: npm install
      - name: Kiem tra kieu
        working-directory: zzz_backtest
        run: npx tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --strict --skipLibCheck --types node sweep.ts run.ts
      - name: Quet tham so
        working-directory: zzz_backtest
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
          INTERVAL: ${{ github.event.inputs.interval }}
          SPLIT: ${{ github.event.inputs.split }}
        run: |
          npx tsx sweep.ts 2>&1 | tee sweep.log
          mkdir -p ../results/zzz
          cp results/zzz/sweep.md results/zzz/sweep_all.csv ../results/zzz/
      - name: Luu ket qua
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add results/zzz/sweep.md results/zzz/sweep_all.csv
          git commit -m "zzz quet tham so: cap nhat ket qua" || echo "khong co thay doi"
          git pull --rebase origin main || true
          git push
